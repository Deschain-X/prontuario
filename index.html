:root{
  --bg:#f6f7f9;--surface:#ffffff;--tint:#fafbfc;--hover:#f3f6fb;
  --line:#e7eaf0;--line-strong:#d5dbe5;
  --ink:#0b1220;--ink-2:#2a3447;--muted:#5f6b7e;--faint:#646e80;
  --blue:#2563eb;--blue-dark:#1d4fc4;--blue-deep:#123072;--blue-50:#f2f6ff;--blue-100:#e3ecfe;--blue-200:#c7d7fd;--blue-300:#9ebafb;
  --night:#0b0f17;--night-2:#141a26;--night-line:#1e2636;
  --amber:#8a5a00;--amber-50:#fff7e6;--amber-line:#f2dfb0;
  --red:#b4372b;--red-50:#fdf1ef;--red-line:#f1ccc6;
  --green:#18774f;--green-50:#eaf6f0;
  --r-sm:8px;--r:10px;--r-lg:14px;
  --sh-1:0 1px 2px rgba(11,18,32,.04);
  --sh-2:0 1px 2px rgba(11,18,32,.04),0 2px 8px rgba(11,18,32,.04);
  --sh-3:0 20px 50px rgba(11,18,32,.18),0 2px 6px rgba(11,18,32,.06);
  --display:"Lora Prontuario",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
::selection{background:var(--blue-200)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#d3d9e3;border-radius:10px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:#b9c2d0;background-clip:padding-box;border:3px solid transparent}
a{color:var(--blue-dark);cursor:pointer;text-decoration:none;font-weight:500}
a:hover{text-decoration:underline;text-underline-offset:3px}
h1,h2,h3{margin:0;color:var(--ink)}
h1{font-family:var(--display);font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
h2{font-size:15px;font-weight:600;letter-spacing:-.005em}
.muted{color:var(--muted)}
.small{font-size:13px}

/* ===== Estrutura ===== */
.app{display:grid;grid-template-columns:244px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--night);display:flex;flex-direction:column;padding:22px 12px 14px;border-right:1px solid var(--night-line)}
.brand{display:flex;align-items:center;gap:11px;padding:2px 12px}
.brand .mark{display:flex;align-items:center}
.brand .mark svg{display:block}
.brand > span:last-child{font-family:var(--display);font-size:21px;font-weight:600;letter-spacing:-.02em;color:#fff;line-height:1}
.side nav{display:flex;flex-direction:column;gap:2px;margin-top:32px}
.side nav a{position:relative;display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:8px;color:#8b98ad;font-weight:500;font-size:14px;transition:background .12s,color .12s}
.side nav a svg.i{width:18px;height:18px}
.side nav a:hover{background:var(--night-2);color:#e8edf5;text-decoration:none}
.side nav a.on{background:var(--night-2);color:#fff}
.side nav a.on svg.i{color:#7da5ff}
.side nav a.on::before{content:"";position:absolute;left:-12px;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:#5b8cff}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:2px}
.side-btn{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:8px;border:0;background:transparent;color:#8b98ad;font-weight:500;font-size:13.5px;cursor:pointer;text-align:left;transition:background .12s,color .12s}
.side-btn svg.i{width:17px;height:17px}
.side-btn:hover{background:var(--night-2);color:#e8edf5}
.side-btn.on{background:var(--night-2);color:#fff}
.side-btn.on svg.i{color:#7da5ff}
.side-btn.bk{font-size:12.5px}
.side-btn.bk.late{color:#e9b04f}
.me{display:flex;align-items:center;gap:10px;margin-top:10px;padding:14px 12px 4px;border-top:1px solid var(--night-line)}
.me > div > b{display:block;font-size:13.5px;font-weight:600;line-height:1.3;color:#f2f5fa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.me > div > span{display:block;font-size:12px;color:#6f7d93;margin-top:1px}
.me .avatar{background:#1a2438;border-color:#26324a;color:#c9d8f5}

.content{min-width:0}
.main{max-width:1040px;margin:0 auto;padding:40px 44px 80px}
.notice{max-width:1040px;margin:22px auto 0;padding:0 44px}
.notice div{background:var(--amber-50);border:1px solid var(--amber-line);color:var(--amber);border-radius:var(--r);padding:11px 14px;display:flex;align-items:center;gap:10px;font-size:13.5px}
.notice.red div{background:var(--red-50);border-color:var(--red-line);color:var(--red)}

.back{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-size:13px;font-weight:500;margin-bottom:18px;padding:4px 8px 4px 4px;margin-left:-4px;border-radius:6px}
.back:hover{color:var(--ink);background:#eceff4;text-decoration:none}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:28px;flex-wrap:wrap}
.page-head .sub{margin-top:8px;display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:14px}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* ===== Botões ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;border:1px solid var(--line-strong);background:var(--surface);padding:0 14px;border-radius:8px;cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap;color:var(--ink-2);box-shadow:var(--sh-1);transition:background .12s,border-color .12s,color .12s}
.btn:hover{background:var(--hover);border-color:#c3cbd8;color:var(--ink)}
.btn:active{transform:translateY(.5px)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff;box-shadow:0 1px 2px rgba(11,18,32,.2)}
.btn.primary:hover{background:#1c2638;border-color:#1c2638;color:#fff}
.btn.danger{color:var(--red);border-color:var(--red-line)}
.btn.danger:hover{background:var(--red-50)}
.btn.danger-solid{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);box-shadow:none}
.btn.ghost:hover{background:#eceff4;color:var(--ink)}
.btn.sm{height:32px;padding:0 11px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;transform:none}

/* ===== Superfícies ===== */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);margin-bottom:20px;box-shadow:var(--sh-2)}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 22px;border-bottom:1px solid var(--line)}
.panel-body{padding:22px}

.stats{display:grid;grid-template-columns:repeat(4,1fr);margin-bottom:20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-2);overflow:hidden}
.stat{padding:18px 22px 20px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat span{display:block;font-size:13px;color:var(--muted)}
.stat b{display:block;font-family:var(--display);font-size:32px;font-weight:500;color:var(--ink);margin-top:6px;line-height:1;font-variant-numeric:lining-nums tabular-nums}
.stat:first-child b{color:var(--blue)}
.stat small{display:block;font-size:12.5px;color:var(--faint);margin-top:6px}

.toolbar{display:flex;gap:16px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.search{flex:1;min-width:220px;display:flex;align-items:center;gap:9px;height:38px;border:1px solid transparent;border-radius:9px;padding:0 12px;background:#f2f4f7;transition:border-color .12s,box-shadow .12s,background .12s}
.search:hover{background:#eceff3}
.search:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-100);background:var(--surface)}
.search input{border:0;outline:0;flex:1;background:transparent;height:100%}
.search input::placeholder{color:var(--faint)}
.search svg{color:var(--faint)}
.check{display:flex;align-items:center;gap:8px;color:var(--muted);cursor:pointer;font-size:13.5px;padding-right:6px}
.check input{accent-color:var(--ink);width:15px;height:15px;margin:0}

.avatar{--h:215;width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;line-height:1;flex-shrink:0;font-size:12.5px;font-weight:600;letter-spacing:.03em;color:hsl(var(--h) 45% 30%);background:hsl(var(--h) 55% 95%);border:1px solid hsl(var(--h) 45% 88%)}
.avatar.sm{width:32px;height:32px;font-size:11.5px}
.avatar.lg{width:68px;height:68px;font-size:24px;font-family:var(--display);font-weight:500;letter-spacing:0}

.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:500;color:var(--faint);font-size:12.5px;padding:10px 22px;border-bottom:1px solid var(--line)}
td{padding:13px 22px;border-bottom:1px solid var(--line);vertical-align:middle;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tr.link{cursor:pointer}
tr.link td{transition:background .1s}
tr.link:hover td{background:var(--hover)}
td.chev{width:44px;color:#c0c7d2}
tr.link:hover td.chev{color:var(--ink)}
.who{display:flex;align-items:center;gap:12px}
.who > div > b{display:block;font-weight:600;color:var(--ink)}
.who > div > span{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
.empty{padding:56px 22px;text-align:center;color:var(--muted)}
.empty p{margin:0 0 16px}

/* ===== Formulários ===== */
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:18px}
.c2{grid-column:span 2}.c3{grid-column:span 3}.c4{grid-column:span 4}.c6{grid-column:span 6}.c1{grid-column:span 1}
.field label{display:block;font-size:13px;font-weight:500;color:var(--ink-2);margin-bottom:7px}
.field label .req{color:var(--blue)}
.field input,.field select{height:40px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line-strong);border-radius:8px;padding:0 12px;background:var(--surface);outline:0;transition:border-color .12s,box-shadow .12s}
.field textarea{padding:11px 12px;resize:vertical;line-height:1.6}
.field input::placeholder,.field textarea::placeholder{color:var(--faint)}
.field input:hover,.field select:hover,.field textarea:hover{border-color:#bcc5d3}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-100)}
.field.bad input,.field.bad textarea{border-color:var(--red)}
.field .err{color:var(--red);font-size:12.5px;margin-top:5px}
.field .hint{color:var(--faint);font-size:12.5px;margin-top:6px}
#r_evolucao{font-family:var(--display);font-size:16px;line-height:1.75;padding:16px 18px;min-height:420px}
.label-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.label-row label{margin:0}
.label-tools{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-family:var(--sans);font-size:.86em;font-weight:600;color:var(--blue-dark)}
.strength{font-size:12.5px;margin-top:6px;font-weight:500}
.s-weak{color:var(--red)}.s-mid{color:var(--amber)}.s-good{color:var(--green)}
.section-title{grid-column:span 6;font-size:13px;font-weight:600;color:var(--ink);border-top:1px solid var(--line);margin-top:6px;padding-top:20px}
.form-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px;border-top:1px solid var(--line);background:var(--tint);border-radius:0 0 var(--r-lg) var(--r-lg);flex-wrap:wrap}

/* ===== Ficha do paciente ===== */
.ficha{display:flex;align-items:center;gap:20px;margin-bottom:24px;flex-wrap:wrap}
.ficha .id{flex:1;min-width:260px}
.ficha .id .sub{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--ink-2);background:#eef1f5;border-radius:6px;padding:3px 9px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:20px 28px;margin:0}
.facts div{min-width:0}
.facts dt{font-size:12.5px;color:var(--faint);margin-bottom:3px}
.facts dd{margin:0;overflow-wrap:anywhere;color:var(--ink);font-variant-numeric:tabular-nums}
.facts .wide{grid-column:span 2}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:6px;white-space:nowrap}
.badge svg.i{width:13px;height:13px;stroke-width:2}
.b-draft{background:#eef1f5;color:#55657a}
.b-open{background:var(--amber-50);color:var(--amber)}
.b-locked{background:var(--blue-100);color:var(--blue-dark)}
.b-arch{background:#eef1f5;color:#55657a}

/* Abas */
.tabs-head{padding:6px 16px 0;align-items:flex-end}
.tabs{display:flex;gap:2px}
.tab{position:relative;display:inline-flex;align-items:center;gap:8px;padding:12px 12px 14px;border:0;background:transparent;color:var(--muted);font-weight:500;font-size:14px;cursor:pointer}
.tab span{font-size:11.5px;font-weight:600;color:var(--faint);background:#eef1f5;border-radius:5px;padding:1px 6px;font-variant-numeric:tabular-nums}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink)}
.tab.on::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;border-radius:2px;background:var(--ink)}
.tab.on span{background:var(--ink);color:#fff}
.tabs-head > .btn{margin-bottom:10px}

/* Linha do tempo */
.tl{position:relative;padding:6px 0}
.tl::before{content:"";position:absolute;left:135px;top:0;bottom:0;width:1px;background:var(--line)}
.tl-item{position:relative;display:grid;grid-template-columns:114px 44px 1fr;align-items:start;padding:15px 22px 15px 0;cursor:pointer;transition:background .1s}
.tl-item:hover{background:var(--hover)}
.tl-date{text-align:right;padding-top:1px}
.tl-date b{display:block;font-size:14px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.005em}
.tl-date span{font-size:12.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.tl-dot{justify-self:center;margin-top:6px;width:11px;height:11px;border-radius:50%;background:var(--surface);border:2px solid var(--blue-300);position:relative;z-index:1;box-shadow:0 0 0 4px var(--surface)}
.tl-item:hover .tl-dot{box-shadow:0 0 0 4px var(--hover)}
.tl-item.rascunho .tl-dot{border-color:#b6c0ce;border-style:dashed}
.tl-item.finalizado .tl-dot{border-color:#d9a03a}
.tl-item.bloqueado .tl-dot{border-color:var(--blue);background:var(--blue)}
.tl-body{min-width:0}
.tl-body p{margin:7px 0 0;color:var(--ink-2);font-family:var(--display);font-size:15px;line-height:1.55;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tl-meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* Anexos */
.att{display:flex;align-items:center;gap:14px;padding:13px 22px;border-bottom:1px solid var(--line);transition:background .1s}
.att:last-child{border-bottom:0}
.att:hover{background:var(--hover)}
.att-ic{width:38px;height:44px;border-radius:6px;display:grid;place-items:center;font-size:10.5px;font-weight:700;letter-spacing:.05em;flex-shrink:0;border:1px solid}
.k-pdf{background:#fdf2f0;color:#a5352a;border-color:#f2d4ce}
.k-img{background:var(--blue-50);color:var(--blue-dark);border-color:var(--blue-200)}
.k-doc{background:#f2f4f7;color:#4a5870;border-color:var(--line-strong)}
.att-main{flex:1;min-width:0;cursor:pointer}
.att-main b{display:block;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att-main span{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);flex-wrap:wrap;margin-top:1px}
.att-main span i{width:3px;height:3px;border-radius:50%;background:#c0c7d2}
.att-main em{display:block;font-style:normal;font-size:13px;color:var(--ink-2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att-act{display:flex;gap:2px}

.list-row{padding:14px 22px;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:0}
.list-row .stamp{font-size:12.5px;color:var(--muted);margin-bottom:2px}

/* ===== Atendimento ===== */
.status{display:flex;gap:11px;align-items:flex-start;padding:13px 16px;border-radius:var(--r);margin-bottom:20px;font-size:14px;line-height:1.5}
.status svg.i{width:17px;height:17px;margin-top:2px}
.st-draft{background:#f1f3f6;color:#45556b}
.st-open{background:var(--amber-50);color:var(--amber)}
.st-locked{background:var(--blue-50);color:var(--blue-deep)}

.sheet{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);margin-bottom:20px;box-shadow:var(--sh-2);overflow:hidden}
.sheet-body{padding:26px 30px}
.sheet.locked .sheet-body{padding:34px 44px 38px}
.sheet .blk{margin-bottom:22px}
.sheet .blk:last-child{margin-bottom:0}
.sheet .blk h3{font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px}
.sheet .blk .txt{white-space:pre-wrap;font-family:var(--display);font-size:16.5px;line-height:1.8;overflow-wrap:anywhere;color:var(--ink);max-width:72ch}
.sheet .blk .txt.none{color:var(--faint);font-family:var(--sans);font-size:14px}
.seal{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:11px 30px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);background:var(--tint)}
.sheet.locked .seal{padding:11px 44px}
.seal code{font-family:var(--mono);font-size:12px;color:var(--ink-2);letter-spacing:.02em}
.ok{color:var(--green);display:inline-flex;align-items:center;gap:5px}
.bad{color:var(--red);display:inline-flex;align-items:center;gap:5px}

.addendum{border-top:1px solid var(--line);padding:16px 22px}
.addendum .stamp{font-size:12.5px;color:var(--muted);margin-bottom:4px}
.addendum .txt{white-space:pre-wrap;font-family:var(--display);font-size:15.5px;line-height:1.7}

details.versions{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);margin-bottom:20px}
details.versions summary{padding:14px 22px;cursor:pointer;font-weight:500;color:var(--muted);font-size:14px}
details.versions summary:hover{color:var(--ink)}
details.versions .ver{border-top:1px solid var(--line);padding:16px 22px}
details.versions .ver h4{margin:0 0 8px;font-size:12.5px;color:var(--muted);font-weight:500}
details.versions .ver .txt{white-space:pre-wrap;font-size:14px;color:var(--ink-2);margin-bottom:8px}

td.ts{white-space:nowrap;color:var(--muted);font-size:13px}
td.act{font-weight:500;white-space:nowrap}
.chain{display:inline-flex;align-items:center;gap:6px;font-size:13px}

.settings{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.settings .panel{margin:0}
.settings .full{grid-column:1/-1}
.settings p{margin:0 0 14px;color:var(--muted);font-size:14px}

/* ===== Entrada ===== */
.auth{min-height:100vh;display:grid;grid-template-columns:minmax(380px,42%) 1fr;background:var(--surface)}
.auth-art{position:relative;overflow:hidden;background:var(--night);display:flex;align-items:center;justify-content:center}
.auth-motif{position:absolute;right:-120px;bottom:-140px;opacity:1;pointer-events:none}
.auth-motif svg{display:block}
.auth-brand{position:relative;z-index:1;display:flex;align-items:center;gap:16px}
.auth-brand svg{display:block}
.auth-brand span{font-family:var(--display);font-size:44px;font-weight:600;letter-spacing:-.025em;color:#fff;line-height:1}
.auth-main{display:flex;align-items:center;justify-content:center;padding:40px 28px}
.auth-card{width:100%;max-width:360px}
.auth-card h1{font-size:30px;margin-bottom:8px}
.auth-card > p{color:var(--muted);margin:0 0 28px;font-size:14.5px}
.auth-card .field{margin-bottom:16px}
.auth-card .btn.primary{width:100%;height:44px;margin-top:8px;font-size:15px}
.pw{position:relative}
.pw input{padding-right:44px}
.pw button{position:absolute;right:4px;top:4px;width:32px;height:32px;border:0;background:transparent;border-radius:6px;color:var(--faint);cursor:pointer;display:grid;place-items:center}
.pw button:hover{background:#eef1f5;color:var(--ink)}
.auth-msg{background:var(--blue-50);color:var(--blue-deep);border-radius:8px;padding:10px 12px;font-size:13.5px;margin-bottom:16px}
.auth-msg.err{background:var(--red-50);color:var(--red)}
.auth-foot{margin-top:28px;padding-top:18px;border-top:1px solid var(--line);font-size:13.5px;color:var(--muted);text-align:center}
.warn-box{background:var(--amber-50);color:var(--amber);border-radius:8px;padding:10px 12px;font-size:13px;margin:4px 0 16px;line-height:1.5}

/* ===== Modal, visualizador e avisos ===== */
.modal-wrap{position:fixed;inset:0;background:rgba(11,15,23,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100;animation:fade .14s}
.modal{background:var(--surface);border-radius:var(--r-lg);max-width:460px;width:100%;padding:24px;box-shadow:var(--sh-3);max-height:90vh;overflow:auto;animation:pop .16s ease-out}
.modal h3{font-family:var(--display);font-size:21px;font-weight:600;letter-spacing:-.01em;margin-bottom:8px}
.modal-body{color:var(--muted);margin-bottom:22px;font-size:14px}
.modal-body .field{margin-top:14px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px}
.viewer{background:var(--surface);border-radius:var(--r-lg);width:min(1100px,94vw);height:min(860px,92vh);display:flex;flex-direction:column;box-shadow:var(--sh-3);overflow:hidden;animation:pop .16s ease-out}
.viewer-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 16px 12px 20px;border-bottom:1px solid var(--line)}
.viewer-head b{display:block;font-weight:600}
.viewer-head span{font-size:12.5px;color:var(--muted)}
.viewer-body{flex:1;min-height:0;background:#eceff3;display:flex;align-items:center;justify-content:center}
.viewer-body img{max-width:100%;max-height:100%;object-fit:contain}
.viewer-body iframe{width:100%;height:100%;border:0;background:#fff}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.985)}to{opacity:1;transform:none}}
#toast{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{background:var(--night);color:#fff;padding:10px 16px;border-radius:9px;font-size:13.5px;font-weight:500;box-shadow:var(--sh-3);animation:pop .16s ease-out;max-width:90vw}
.toast.error{background:var(--red)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;top:0;z-index:20;height:auto;flex-direction:row;align-items:center;padding:10px 12px;border-right:0;border-bottom:1px solid var(--night-line);gap:8px;overflow-x:auto}
  .side nav{flex-direction:row;margin:0 0 0 8px}
  .side nav a.on::before{display:none}
  .side nav a span,.side-btn span,.me,.brand > span:last-child{display:none}
  .side-foot{margin:0 0 0 auto;flex-direction:row}
  .main{padding:24px 16px 60px}
  .notice{padding:0 16px}
  .stats{grid-template-columns:1fr 1fr}
  .stat:nth-child(2){border-right:0}
  .stat:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .auth{grid-template-columns:1fr}
  .auth-art{min-height:200px}
  .auth-brand span{font-size:34px}
}
@media (max-width:640px){
  .hide-sm{display:none}
  .grid{grid-template-columns:1fr 1fr}
  .c1,.c2,.c3{grid-column:span 1}
  .c4,.c6,.section-title{grid-column:span 2}
  .facts{grid-template-columns:1fr 1fr}
  .settings{grid-template-columns:1fr}
  th,td{padding:11px 14px}
  .tl::before{left:23px}
  .tl-item{grid-template-columns:46px 1fr;padding-right:14px}
  .tl-date{grid-column:2;grid-row:1;text-align:left;display:flex;gap:8px;align-items:baseline}
  .tl-dot{grid-column:1;grid-row:1 / span 2}
  .tl-body{grid-column:2}
  .sheet.locked .sheet-body{padding:24px 22px}
}

/* ===== Impressão / PDF ===== */
#print-area{display:none}
@media print{
  body{background:#fff;font-size:11pt}
  #app,#toast,.modal-wrap{display:none!important}
  #print-area{display:block;color:#000}
  .p-head{border-bottom:1.5px solid #0b1220;padding-bottom:10px;margin-bottom:16px}
  .p-head h1{font-family:var(--display);font-size:20pt;margin:0;display:flex;align-items:center;gap:10px}
  .p-head .pro{color:#333;margin-top:4px}
  .p-pat{display:grid;grid-template-columns:1fr 1fr;gap:4px 24px;margin-bottom:18px;font-size:10.5pt}
  .p-rec{border-top:1px solid #bbb;padding-top:10px;margin-top:14px;page-break-inside:avoid}
  .p-rec h2{font-size:12pt;margin:0 0 2px}
  .p-rec .st{font-size:9.5pt;color:#444;margin-bottom:8px}
  .p-rec h3{font-size:10pt;margin:8px 0 2px;color:#1d4fc4}
  .p-rec .txt{white-space:pre-wrap;font-family:var(--display);line-height:1.6}
  .p-rec .selo{font-size:8.5pt;color:#555;margin-top:8px;font-family:var(--mono)}
  .p-add{margin-top:8px;padding-left:10px;border-left:2px solid #ccc}
  .p-foot{margin-top:28px;font-size:9pt;color:#555}
  .p-sign{margin-top:46px;width:280px;border-top:1px solid #000;padding-top:4px;font-size:10pt}
}
.modal.wide{max-width:760px}
.ia-draft{width:100%;font-family:var(--display);font-size:15px;line-height:1.55}
.ia-note{font-size:13px;color:var(--muted);margin:0 0 10px}
.ia-sent{font-size:12.5px;margin-top:10px}
.ia-sent pre{white-space:pre-wrap;font-family:var(--mono);font-size:12px;background:var(--tint);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px;max-height:220px;overflow:auto;margin:8px 0 0}
.btn.ia{border-color:var(--blue);color:var(--blue-dark)}
.btn.ia:hover{background:var(--blue-50)}
.chip.ia-ok{background:var(--blue-50);color:var(--blue-dark)}
.busy-wrap{position:fixed;inset:0;z-index:300;background:rgba(11,15,23,.28);display:none;align-items:center;justify-content:center;backdrop-filter:blur(1px)}
.busy{display:flex;align-items:center;gap:14px;background:var(--surface);padding:18px 22px;border-radius:var(--r-lg);box-shadow:var(--sh-3);font-weight:500;color:var(--ink)}
.spin{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--blue-100);border-top-color:var(--blue);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{display:flex;align-items:center;gap:9px}
.toast svg.i{width:17px;height:17px}
.toast.ok svg.i{color:#5ee0a0}
.toast.error svg.i{color:#fff}
.side-new{display:flex;align-items:center;gap:10px;margin:26px 0 0;height:40px;padding:0 14px;border-radius:9px;border:0;background:var(--blue);color:#fff;font:inherit;font-weight:600;font-size:14px;cursor:pointer;transition:background .12s}
.side-new:hover{background:var(--blue-dark)}
.side-new svg.i{width:18px;height:18px}
.side .side-new + nav{margin-top:18px}
.rec-who{display:flex;align-items:center;gap:12px;margin-top:10px;flex-wrap:wrap}
.rec-who b{display:block;font-size:16px;color:var(--ink)}
.rec-who span{font-size:13px;color:var(--muted)}
.saved-at{font-size:13px;color:var(--muted);margin-right:10px;display:inline-flex;align-items:center;gap:6px}
.saved-at.warn{color:var(--amber)}
.picker{max-width:540px}
.pk-search{display:flex;align-items:center;gap:8px;border:1px solid var(--line-strong);border-radius:var(--r);padding:0 12px;height:42px;margin-bottom:10px}
.pk-search input{border:0;outline:0;flex:1;font:inherit;font-size:15px;background:transparent;height:100%}
.pk-search:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-100)}
.pk-list{display:flex;flex-direction:column;gap:2px;min-height:60px;max-height:50vh;overflow:auto}
.pk-item{display:flex;align-items:center;gap:12px;text-align:left;padding:9px 10px;border-radius:var(--r-sm);border:0;background:transparent;cursor:pointer;font:inherit}
.pk-item:hover,.pk-item.on{background:var(--blue-50)}
.pk-item b{display:block;color:var(--ink);font-size:14.5px}
.pk-item small{color:var(--muted);font-size:12.5px}
.pk-empty{padding:18px 10px;color:var(--muted);font-size:14px}
.fin-prev{background:var(--tint);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;font-family:var(--display);font-size:13.5px;white-space:pre-wrap;max-height:180px;overflow:auto;margin:10px 0}
.fin-warn{background:var(--amber-50);border:1px solid var(--amber-line);color:var(--amber);border-radius:var(--r-sm);padding:9px 12px;font-size:13.5px;margin:10px 0}
.fin-warn div+div{margin-top:4px}
.list-row.link{cursor:pointer}
.list-row.link:hover{background:var(--hover)}
.cb-row{display:grid;grid-template-columns:180px 1fr 170px auto;gap:10px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.cb-row:first-child{border-top:0}
.cb-row textarea{font-family:var(--mono);font-size:13px}
@media (max-width:760px){.cb-row{grid-template-columns:1fr}}
.ret-list .list-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ret-list .list-row .grow{flex:1;min-width:180px}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--blue-50);color:var(--blue-dark)}
.tag.late{background:var(--amber-50);color:var(--amber)}
.tag.today{background:var(--blue);color:#fff}
.chip.soft{background:transparent;border:1px dashed var(--line-strong);color:var(--faint)}
.sc-item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.sc-item:first-child{border-top:0}
.sc-item .q{font-size:14px;color:var(--ink)}
.sc-opts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.sc-opts label{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:32px;padding:0 8px;border:1px solid var(--line-strong);border-radius:8px;cursor:pointer;font-size:13px;color:var(--muted);user-select:none}
.sc-opts input{display:none}
.sc-opts input:checked + span{color:#fff}
.sc-opts label:has(input:checked){background:var(--blue);border-color:var(--blue);color:#fff}
.sc-legend{font-size:12.5px;color:var(--muted);margin:4px 0 8px}
.sc-total{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--tint);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;margin-top:10px;font-size:14px}
.sc-total b{font-size:18px;color:var(--ink)}

/* ================== Utilidades ================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const digits = s => String(s || '').replace(/\D/g, '');
const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
function uid(){
  if (crypto.randomUUID) return crypto.randomUUID();
  return [...crypto.getRandomValues(new Uint8Array(16))].map(b => b.toString(16).padStart(2,'0')).join('');
}
function fmtCPF(v){ v = digits(v).slice(0,11); return v.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2'); }
function fmtCEP(v){ v = digits(v).slice(0,8); return v.replace(/(\d{5})(\d)/,'$1-$2'); }
function validCPF(c){
  c = digits(c);
  if (c.length !== 11 || /^(\d)\1+$/.test(c)) return false;
  let s = 0; for (let i=0;i<9;i++) s += +c[i]*(10-i);
  let d = (s*10)%11; if (d===10) d=0; if (d !== +c[9]) return false;
  s = 0; for (let i=0;i<10;i++) s += +c[i]*(11-i);
  d = (s*10)%11; if (d===10) d=0; return d === +c[10];
}
function fmtDate(iso){ if(!iso) return '—'; const [y,m,d] = iso.split('-'); return `${d}/${m}/${y}`; }
function fmtDT(x){ if(!x) return '—'; return new Date(x).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
function fmtDay(x){ return new Date(x).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'}); }
function fmtTime(x){ return new Date(x).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }
function age(iso){
  if(!iso) return null; const b = new Date(iso+'T00:00'); const n = new Date();
  let a = n.getFullYear()-b.getFullYear(); const m = n.getMonth()-b.getMonth();
  if (m<0 || (m===0 && n.getDate()<b.getDate())) a--; return a;
}
function nowInput(){ const d = new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,16); }
function todayISO(){ return nowInput().slice(0,10); }
function fmtLeft(ms){ const h = Math.floor(ms/3600000), m = Math.floor((ms%3600000)/60000); return h>0 ? `${h}h ${String(m).padStart(2,'0')}min` : `${m}min`; }
function initials(nome){
  const skip = ['da','de','do','das','dos','e'];
  return String(nome||'').split(/\s+/).filter(w => w && !skip.includes(w.toLowerCase())).map(w => w[0].toUpperCase()).join('');
}
/* Horário efetivo: nunca anterior ao último horário já registrado, para que atrasar o relógio não desbloqueie registros */

/* Tela de carregamento: aparece só se a operação passar de 200 ms */
let busyN = 0, busyT = null;
function busy(msg){
  busyN++; clearTimeout(busyT);

    let b = $('#busy');
    if (!b) { b = document.createElement('div'); b.id = 'busy'; b.className = 'busy-wrap'; b.innerHTML = '<div class="busy" role="status"><span class="spin"></span><span class="busy-msg"></span></div>'; document.body.appendChild(b); }

async function withBusy(msg, fn){ busy(msg); try { return await fn(); } finally { unbusy(); } }
function pwScore(pw){ let s=0; if(pw.length>=MIN_PW)s++; if(pw.length>=14)s++; if(/[a-z]/.test(pw)&&/[A-Z]/.test(pw))s++; if(/\d/.test(pw))s++; if(/[^A-Za-z0-9]/.test(pw))s++; return s; }
function attachStrength(inputId, outId){

      b.onclick = () => { const v = typeof a.value === 'function' ? a.value(w) : a.value; if (v === undefined) return; done(v); };

    });

/* ================== Armazenamento local (IndexedDB) ================== */
const idb = {
  _db:null,
  open(){ return new Promise((res,rej) => { const r = indexedDB.open('prontuario-db',1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async conn(){ if(!this._db) this._db = await this.open(); return this._db; },
  async get(k){ const db = await this.conn(); return new Promise((res,rej) => { const q = db.transaction('kv','readonly').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
  async set(k,v){ const db = await this.conn(); return new Promise((res,rej) => { const t = db.transaction('kv','readwrite'); t.objectStore('kv').put(v,k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); },
  async del(k){ const db = await this.conn(); return new Promise((res,rej) => { const t = db.transaction('kv','readwrite'); t.objectStore('kv').delete(k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); },
  async keys(){ const db = await this.conn(); return new Promise((res,rej) => { const q = db.transaction('kv','readonly').objectStore('kv').getAllKeys(); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
};
async function storeGet(){
  try { const v = await idb.get(STORE_KEY); if (v) return v; } catch(e) {}
  const l = localStorage.getItem(STORE_KEY); return l ? JSON.parse(l) : null;
}
async function storeSet(v){
  try { await idb.set(STORE_KEY, v); } catch(e) { localStorage.setItem(STORE_KEY, JSON.stringify(v)); }
}

/* ================== Criptografia e integridade ================== */
const enc = new TextEncoder(), dec = new TextDecoder();
function toB64(buf){ const b = new Uint8Array(buf); let s=''; for (let i=0;i<b.length;i+=0x8000) s += String.fromCharCode.apply(null, b.subarray(i,i+0x8000)); return btoa(s); }
function fromB64(s){ const bin = atob(s); const a = new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) a[i] = bin.charCodeAt(i); return a; }
async function deriveKey(pw, salt){
  const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:ITER, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function encryptJSON(obj, key){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, enc.encode(JSON.stringify(obj)));
  return { iv:toB64(iv), data:toB64(ct) };
}
async function decryptJSON(p, key){
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:fromB64(p.iv)}, key, fromB64(p.data));
  return JSON.parse(dec.decode(pt));
}
async function sha256(str){ const h = await crypto.subtle.digest('SHA-256', enc.encode(str)); return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2,'0')).join(''); }
function recCanon(r){ return JSON.stringify({ id:r.id, patientId:r.patientId, dataAtendimento:r.dataAtendimento, campos:{ motivo:r.campos.motivo, evolucao:r.campos.evolucao, conduta:r.campos.conduta }, finalizadoEm:r.finalizadoEm }); }
async function seal(r){ r.selo = await sha256(recCanon(r)); }
const fmtSelo = s => s ? s.slice(0,32).match(/.{4}/g).join(' ') : '';
/* Auditoria encadeada: cada entrada carrega o hash da anterior */
const auditLine = (prev, a) => `${prev}|${a.ts}|${a.acao}|${a.detalhe}`;
async function chainAudit(){ let prev = ''; for (const a of S.db.audit) { if (!a.h) a.h = await sha256(auditLine(prev, a)); prev = a.h; } }
async function verifyChain(){
  let prev = '';
  for (let i=0;i<S.db.audit.length;i++) { const a = S.db.audit[i]; if (a.h !== await sha256(auditLine(prev, a))) return { ok:false, at:i }; prev = a.h; }
  return { ok:true };
}
async function persist(){
  S.db.maxTs = Math.max(S.db.maxTs || 0, Date.now());
  await chainAudit();
  const p = await encryptJSON(S.db, S.key);
  await storeSet({ v:1, salt:toB64(S.salt), iv:p.iv, data:p.data });
}
function log(acao, detalhe=''){ S.db.audit.push({ ts:Date.now(), acao, detalhe }); }
async function commit(){ try { await persist(); } catch(e){ toast('Não foi possível salvar os dados neste navegador.', 'error'); throw e; } }

/* Atualiza bancos da versão 1 para a versão 2 */
async function migrate(db){
  const old = db.v || 1;
  db.config ??= { idleMin:15, cep:true };
  db.config.cabecalho ??= DEFAULT_HEADER;
  db.config.estrutura ??= DEFAULT_STRUCT;
  db.config.ia ??= { ativo:false, chave:'', modelo:IA_MODELS[0][0], anterior:true, instrucoes:'' };
  db.config.ia.psiq ??= DEFAULT_IA_PSIQ; db.config.ia.eem ??= DEFAULT_IA_EEM;
  db.config.botoes ??= [];
  db.config.autoBk ??= true;
  db.config.waMsg ??= DEFAULT_WA;
  db.config.retPadrao ??= '30';
  db.escalas ??= [];
  db.agenda ??= [];
  db.config.ag ??= { ini:'08:00', fim:'20:00', dur:50, sab:false, titulo:'iniciais' };
  db.incidentes ??= [];
  db.anexos ??= [];
  db.patients.forEach(p => { p.entregas ??= []; });
  for (const r of db.records) if (r.status === 'finalizado' && !r.selo) r.selo = await sha256(recCanon(r));
  db.v = DB_VERSION;
  return old < DB_VERSION;
}
function checkClock(){
  if (S.db.maxTs && Date.now() < S.db.maxTs - CLOCK_TOLERANCE) {
    S.clockWarn = true;
    log('Relógio retroativo detectado', `Hora do computador ${fmtDT(Date.now())}; último registro ${fmtDT(S.db.maxTs)}`);
  } else S.clockWarn = false;
}
const idleMs = () => (S.db?.config?.idleMin || 15) * 60000;

/* ================== Dados ================== */
const getP = id => S.db.patients.find(p => p.id === id);
const getR = id => S.db.records.find(r => r.id === id);
const recsOf = pid => S.db.records.filter(r => r.patientId === pid && !r.anulado).sort((a,b) => b.dataAtendimento.localeCompare(a.dataAtendimento));
const anuladosOf = pid => S.db.records.filter(r => r.patientId === pid && r.anulado).sort((a,b) => b.dataAtendimento.localeCompare(a.dataAtendimento));
function fmtTel(v){ v = digits(v).slice(0,11); if (!v) return ''; if (v.length < 3) return '(' + v; const dd = v.slice(0,2), r = v.slice(2), k = r.length > 8 ? 5 : 4; return `(${dd}) ${r.slice(0,k)}${r.length > k ? '-' + r.slice(k) : ''}`; }
const idDoc = p => p.cpf ? 'CPF ' + dCPF(p.cpf) : p.docNum ? `${p.docTipo || 'Doc.'} ${S.discreto ? '•••' + String(p.docNum).slice(-3) : esc(p.docNum)}` : 'sem CPF';
const dTel = t => !t ? '—' : S.discreto ? '(••) •••••-' + digits(t).slice(-4) : fmtTel(t);
function addDays(iso, n){ const d = new Date(iso.slice(0,10) + 'T12:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0,10); }
function daysBetween(a, b){ return Math.round((new Date(b + 'T12:00') - new Date(a + 'T12:00')) / 86400000); }
/* Retorno previsto do paciente: o do último atendimento finalizado */
function lastFinal(pid){ return recsOf(pid).find(r => r.status !== 'rascunho') || null; }
function nextReturn(p){ return lastFinal(p.id)?.retorno || null; }
function recStatus(r){
  if (r.status === 'rascunho') return 'rascunho';
  return (effNow() - r.finalizadoEm) < LOCK_MS ? 'finalizado' : 'bloqueado';

function badge(st){

function fullAddress(p){
  const l1 = [p.logradouro, p.numero].filter(Boolean).join(', ');
  const parts = [l1, p.complemento, p.bairro, [p.cidade, p.uf].filter(Boolean).join('/')].filter(Boolean);

}

function renderLogin(info){
  authShell(`

async function doLogin(){
  const btn = $('#l_btn'); btn.disabled = true; btn.textContent = 'Verificando…'; busy('Abrindo o prontuário…');
  let db, key, salt;
  try {
    const stored = await storeGet();
    salt = fromB64(stored.salt);
    key = await deriveKey($('#l_pw').value, salt);
    db = await decryptJSON(stored, key);
  } catch(e) {
    unbusy(); $('#l_msg').innerHTML = '<div class="auth-msg err">Senha incorreta.</div>';
    btn.disabled = false; btn.textContent = 'Entrar'; $('#l_pw').select(); return;
  }
  const upgraded = await migrate(db);
  S.db = db; S.key = key; S.salt = salt;
  if (upgraded) log('Sistema atualizado', `Versão ${DB_VERSION}: selo de integridade e auditoria encadeada`);
  checkClock();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
  log('Acesso ao sistema'); await commit(); unbusy();
  if (S.db.config.autoBk !== false) { const d = await bkDir(); if (d) S.bkPerm = await bkPerm(d, true); }
  S.lastActivity = Date.now(); S.view = 'patients'; S.param = null;

async function lockNow(auto){

  if (view === 'record' && param && !param.startsWith('new:') && getR(param)) { const r = getR(param); log('Atendimento visualizado', `${getP(r.patientId).nome}, ${fmtDT(r.dataAtendimento)}`); commit().catch(()=>{}); }

async function lookupCEP(cep){

    if (j.logradouro) $('#f_logradouro').value = j.logradouro;
    if (j.bairro) $('#f_bairro').value = j.bairro;
    if (j.localidade) $('#f_cidade').value = j.localidade;
    if (j.uf) $('#f_uf').value = j.uf;
    st.textContent = 'Endereço encontrado. Confira e informe o número.'; $('#f_numero').focus(); S.dirty = true;
  } catch(e) { st.textContent = 'Sem conexão com a internet. Preencha o endereço manualmente.'; }

  else if (S.db.patients.some(p => p.cpf===d.cpf && p.id!==id)) { fieldErr('cpf','Já existe um paciente com este CPF.'); ok = false; }
  if (d.telefone && (d.telefone.length < 10 || d.telefone.length > 11)) { fieldErr('telefone','Informe DDD e número.'); ok = false; }
  if (d.nascimento && d.nascimento > todayISO()) { fieldErr('nascimento','A data não pode estar no futuro.'); ok = false; }
  if (!ok) { toast('Corrija os campos destacados.', 'error'); return; }
  const gem = d.nascimento && S.db.patients.find(p => p.id !== id && norm(p.nome) === norm(d.nome) && p.nascimento === d.nascimento);
  if (gem && !(await confirmBox('Possível paciente duplicado', `Já existe ${esc(gem.nome)}, com a mesma data de nascimento (${idDoc(gem)}). Cadastrar mesmo assim?`, 'Cadastrar mesmo assim'))) return;

  const now = Date.now();
  if (!id) {
    const p = { id:uid(), ...d, arquivado:false, entregas:[], criadoEm:now, atualizadoEm:now, iaConsent: $('#f_ia').checked ? now : null };
    S.db.patients.push(p); log('Paciente cadastrado', p.nome); id = p.id;
    if (p.iaConsent) log('Consentimento de IA registrado', p.nome);
  } else {
    const p = getP(id);
    const labels = {nome:'nome',cpf:'CPF',nascimento:'nascimento',profissao:'profissão',docTipo:'tipo de documento',docNum:'documento',nomeSocial:'nome social',sexo:'sexo',telefone:'celular',cep:'CEP',logradouro:'logradouro',numero:'número',complemento:'complemento',bairro:'bairro',cidade:'cidade',uf:'UF'};
    const changed = Object.keys(d).filter(k => (p[k]||'') !== d[k]).map(k => labels[k]);
    const iaNew = $('#f_ia').checked;
    if (iaNew !== !!p.iaConsent) { p.iaConsent = iaNew ? now : null; log(iaNew ? 'Consentimento de IA registrado' : 'Consentimento de IA revogado', p.nome); }
    if (!changed.length) { await commit(); S.dirty = false; go('patient', id); return; }
    Object.assign(p, d, { atualizadoEm:now });
    log('Cadastro alterado', `${p.nome}: ${changed.join(', ')}`);
  }
  await commit(); S.dirty = false; toast('Paciente salvo.', 'ok'); go('patient', id);
}
/* Importação de pacientes de outro sistema: valida CPF, ignora duplicados e registra na auditoria */
async function importPatients(lista, origem){
  const res = { importados:0, duplicados:0, invalidos:[] }; const now = Date.now();
  for (const x of lista) {
    const nome = String(x.nome || '').replace(/\s+/g, ' ').trim(); const cpf = digits(x.cpf);
    if (nome.length < 3 || !validCPF(cpf)) { res.invalidos.push(nome || '(sem nome)'); continue; }
    if (S.db.patients.some(p => p.cpf === cpf)) { res.duplicados++; continue; }
    const nasc = /^\d{4}-\d{2}-\d{2}$/.test(x.nascimento || '') && x.nascimento <= todayISO() ? x.nascimento : '';
    S.db.patients.push({ id:uid(), nome, cpf, nascimento:nasc, profissao:'', cep:'', logradouro:'', numero:'', complemento:'', bairro:'', cidade:'', uf:'',
      arquivado:false, entregas:[], criadoEm:now, atualizadoEm:now, iaConsent:null, origem });
    res.importados++;
  }
  if (res.importados) { log('Pacientes importados', `${res.importados} de ${origem}; ${res.duplicados} já existiam; ${res.invalidos.length} com CPF inválido`); await commit(); render(); }
  return res;
}
function pickImport(){
  const i = document.createElement('input'); i.type = 'file'; i.accept = '.json,.pimport';
  i.onchange = () => i.files[0] && importFile(i.files[0]); i.click();
}
async function importFile(file){
  let pkg; try { pkg = JSON.parse(await file.text()); } catch(e) { toast('Arquivo de importação inválido.', 'error'); return; }
  if (pkg.tipo !== 'prontuario-importacao' || !pkg.salt || !pkg.iv || !pkg.data) { toast('Este arquivo não é uma importação de pacientes.', 'error'); return; }
  const code = await modal({ title:'Importar pacientes', body:`<p style="margin:0">Arquivo de importação de ${esc(pkg.origem || 'outro sistema')}. Digite o código de importação.</p><div class="field"><label>Código</label><input id="m_code" autocomplete="off" style="font-family:var(--mono);letter-spacing:.08em"></div>`,
    actions:[{label:'Cancelar', value:null},{label:'Abrir', cls:'primary', primary:true, value: w => w.querySelector('#m_code').value.trim()}] });
  if (!code) return;
  let lista;
  busy('Abrindo o arquivo de importação…');
  try {
    const base = await crypto.subtle.importKey('raw', enc.encode(code.toUpperCase()), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name:'PBKDF2', salt:fromB64(pkg.salt), iterations:pkg.iter || 200000, hash:'SHA-256' }, base, { name:'AES-GCM', length:256 }, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name:'AES-GCM', iv:fromB64(pkg.iv) }, key, fromB64(pkg.data));
    lista = JSON.parse(new TextDecoder().decode(plain));
  } catch(e) { unbusy(); toast('Código incorreto ou arquivo corrompido.', 'error'); return; }
  unbusy();
  const novos = lista.filter(x => validCPF(x.cpf) && !S.db.patients.some(p => p.cpf === digits(x.cpf)));
  const ja = lista.filter(x => S.db.patients.some(p => p.cpf === digits(x.cpf))).length;
  const inv = lista.filter(x => !validCPF(x.cpf));
  const ok = await confirmBox('Confirmar importação', `<b style="color:var(--ink)">${lista.length}</b> pacientes no arquivo.<br>${novos.length} serão cadastrados${ja ? `, ${ja} já existem e serão ignorados` : ''}${inv.length ? `, ${inv.length} têm CPF inválido e serão ignorados (${inv.slice(0,5).map(x => esc(x.nome)).join(', ')}${inv.length > 5 ? '…' : ''})` : ''}.<br><br>Os cadastros entram sem data de nascimento e endereço, para você completar depois. A importação fica registrada na auditoria.`, 'Importar');
  if (!ok) return;
  const r = await withBusy('Cadastrando os pacientes…', () => importPatients(lista, pkg.origem || 'importação'));
  toast(`${r.importados} pacientes importados. Apague o arquivo de importação da pasta.`, 'ok');
}

function setPtab(t){ S.ptab = t; render(); }

/* ================== Exames e documentos anexados ================== */
const ATT_MAX = 25 * 1024 * 1024;
const ATT_CATS = {
  exame: ['Laboratorial','Imagem','Eletrocardiograma','Eletroencefalograma','Polissonografia','Avaliação neuropsicológica','Outro'],
  documento: ['Laudo','Relatório','Receita','Atestado','Termo de consentimento','Encaminhamento','Documento pessoal','Outro']
};
const attsOf = (pid, tipo) => (S.db.anexos || []).filter(a => a.patientId === pid && a.tipo === tipo).sort((a,b) => (b.data||'').localeCompare(a.data||'') || b.criadoEm - a.criadoEm);
function fmtSize(n){ return n < 1024*1024 ? Math.max(1, Math.round(n/1024)) + ' KB' : (n/1024/1024).toFixed(1).replace('.', ',') + ' MB'; }
function attKind(mime, nome){ if ((mime||'').startsWith('image/')) return 'IMG'; if (mime === 'application/pdf' || /\.pdf$/i.test(nome)) return 'PDF'; return 'DOC'; }
async function encryptBuf(buf, key){ const iv = crypto.getRandomValues(new Uint8Array(12)); return { iv, data: await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, buf) }; }
const decryptBuf = (p, key) => crypto.subtle.decrypt({name:'AES-GCM', iv:p.iv}, key, p.data);
async function sha256buf(buf){ const h = await crypto.subtle.digest('SHA-256', buf); return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2,'0')).join(''); }

function attList(p, tipo){
  const list = attsOf(p.id, tipo);
  const nome = tipo === 'exame' ? 'exame' : 'documento';
  if (!list.length) return `<div class="empty"><p>Nenhum ${nome} anexado para este paciente.</p><button class="btn primary sm" onclick="pickAttachment('${p.id}','${tipo}')" ${p.arquivado ? 'disabled' : ''}>${ico.clip}Anexar ${nome}</button></div>`;
  return list.map(a => { const k = attKind(a.mime, a.nomeArquivo); const canRemove = effNow() - a.criadoEm < LOCK_MS;
    return `<div class="att">
      <div class="att-ic k-${k.toLowerCase()}">${k}</div>
      <div class="att-main" onclick="openAttachment('${a.id}')">
        <b>${S.discreto ? esc(a.categoria) : esc(a.titulo)}</b>
        <span>${esc(a.categoria)}${a.data ? `<i></i>${fmtDate(a.data)}` : ''}<i></i>${fmtSize(a.tamanho)}</span>
        ${a.obs && !S.discreto ? `<em>${esc(a.obs)}</em>` : ''}
      </div>
      <div class="att-act">
        <button class="btn ghost sm" onclick="openAttachment('${a.id}')" title="Visualizar">${ico.eye}<span class="hide-sm">Ver</span></button>
        <button class="btn ghost sm" onclick="downloadAttachment('${a.id}')" title="Baixar">${ico.download}</button>
        ${canRemove ? `<button class="btn ghost sm" onclick="removeAttachment('${a.id}')" title="Remover (permitido até 24 h após anexar)">${ico.trash}</button>` : ''}
      </div></div>`; }).join('');
}
function pickAttachment(pid, tipo){
  const inp = document.createElement('input'); inp.type = 'file'; inp.multiple = true;
  inp.accept = tipo === 'exame' ? 'application/pdf,image/*' : 'application/pdf,image/*,.doc,.docx,.odt,.txt,.rtf';
  inp.onchange = async () => { for (const f of inp.files) { const ok = await addAttachment(pid, tipo, f); if (ok === null) break; } render(); };
  inp.click();
}
async function addAttachment(pid, tipo, file){
  if (file.size > ATT_MAX) { toast(`${file.name} tem mais de 25 MB e não foi anexado.`, 'error'); return false; }
  const p = getP(pid); const label = tipo === 'exame' ? 'exame' : 'documento';
  const base = file.name.replace(/\.[^.]+$/, '');
  const v = await modal({ title: tipo === 'exame' ? 'Anexar exame' : 'Anexar documento', body: `
    <p style="margin:0">${esc(file.name)}, ${fmtSize(file.size)}</p>
    <div class="field"><label>Título</label><input id="a_tit" value="${esc(base)}"></div>
    <div class="field"><label>Categoria</label><select id="a_cat">${ATT_CATS[tipo].map(c => `<option>${c}</option>`).join('')}</select></div>
    <div class="field"><label>Data do ${label}</label><input type="date" id="a_data" value="${todayISO()}" max="${todayISO()}"></div>
    <div class="field"><label>Observação</label><input id="a_obs" placeholder="${tipo === 'exame' ? 'Ex.: TSH 2,1; hemograma sem alterações' : 'Ex.: laudo para perícia do INSS'}"></div>`,
    actions:[{label:'Cancelar', value:null},{label:'Anexar', cls:'primary', primary:true, value: w => {
      const titulo = w.querySelector('#a_tit').value.trim();
      if (!titulo) { toast('Informe um título.', 'error'); return undefined; }
      return { titulo, categoria:w.querySelector('#a_cat').value, data:w.querySelector('#a_data').value, obs:w.querySelector('#a_obs').value.trim() };
    }}] });
  if (!v) return null;
  busy('Criptografando e guardando o arquivo…');
  try {
    const buf = await file.arrayBuffer();
    const hash = await sha256buf(buf);
    const id = uid();
    await idb.set('att:' + id, await encryptBuf(buf, S.key));
    S.db.anexos.push({ id, patientId:pid, tipo, ...v, nomeArquivo:file.name, mime:file.type || 'application/octet-stream', tamanho:file.size, hash, criadoEm:Date.now() });
    log(tipo === 'exame' ? 'Exame anexado' : 'Documento anexado', `${p.nome}: ${v.titulo}`);
    await commit(); unbusy(); toast(tipo === 'exame' ? 'Exame anexado.' : 'Documento anexado.', 'ok');
    return true;
  } catch(e) { unbusy(); toast('Não foi possível guardar o arquivo neste navegador.', 'error'); return false; }
}
async function loadAttachment(a){
  const rec = await idb.get('att:' + a.id);
  if (!rec) throw new Error('missing');
  const buf = await decryptBuf(rec, S.key);
  return { buf, ok: (await sha256buf(buf)) === a.hash };
}
async function openAttachment(id){
  const a = S.db.anexos.find(x => x.id === id); if (!a) return;
  let res; try { res = await loadAttachment(a); } catch(e) { toast('Arquivo não encontrado neste computador. Restaure um backup que o contenha.', 'error'); return; }
  const url = URL.createObjectURL(new Blob([res.buf], {type:a.mime}));
  const k = attKind(a.mime, a.nomeArquivo);
  const w = document.createElement('div'); w.className = 'modal-wrap';
  w.innerHTML = `<div class="viewer" role="dialog" aria-modal="true">
    <div class="viewer-head"><div><b>${esc(a.titulo)}</b><span>${esc(a.categoria)}${a.data ? ', ' + fmtDate(a.data) : ''}. ${res.ok ? `<span class="ok">${ico.check} arquivo íntegro</span>` : `<span class="bad">${ico.alert} arquivo diferente do original</span>`}</span></div>
      <div class="actions"><button class="btn sm" data-dl>${ico.download}Baixar</button><button class="btn ghost sm" data-close>Fechar</button></div></div>
    <div class="viewer-body">${k === 'IMG' ? `<img src="${url}" alt="${esc(a.titulo)}">` : k === 'PDF' ? `<iframe src="${url}" title="${esc(a.titulo)}"></iframe>` : `<div class="empty"><p>Este tipo de arquivo não tem pré-visualização. Baixe para abrir no programa adequado.</p></div>`}</div></div>`;
  const close = () => { w.remove(); URL.revokeObjectURL(url); };
  w.querySelector('[data-close]').onclick = close;
  w.querySelector('[data-dl]').onclick = () => downloadAttachment(id);
  w.addEventListener('mousedown', e => { if (e.target === w) close(); });
  w.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  document.body.appendChild(w); w.querySelector('[data-close]').focus();
  log('Anexo visualizado', `${getP(a.patientId).nome}: ${a.titulo}`); commit().catch(()=>{});
}
async function downloadAttachment(id){
  const a = S.db.anexos.find(x => x.id === id); if (!a) return;
  let res; try { res = await loadAttachment(a); } catch(e) { toast('Arquivo não encontrado neste computador.', 'error'); return; }
  const url = URL.createObjectURL(new Blob([res.buf], {type:a.mime}));
  const el = document.createElement('a'); el.href = url; el.download = a.nomeArquivo; document.body.appendChild(el); el.click(); el.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  log('Anexo baixado', `${getP(a.patientId).nome}: ${a.titulo}`); await commit();
  toast('Arquivo baixado sem criptografia. Apague-o da pasta de downloads após o uso.');
}
async function removeAttachment(id){
  const a = S.db.anexos.find(x => x.id === id); if (!a) return;
  if (effNow() - a.criadoEm >= LOCK_MS) { toast('Anexos só podem ser removidos até 24 horas após serem incluídos.', 'error'); render(); return; }
  if (!(await confirmBox('Remover anexo', `“${esc(a.titulo)}” será removido. A remoção fica registrada na auditoria.`, 'Remover', true))) return;

/* ================== Cabeçalho clínico ================== */
function fmtClinical(t){ return esc(t).replace(/^(#[^:\n]*:?)/gm, '<b class="tag">$1</b>').replace(/^((?:S|I|Cd):)/gm, '<b class="tag">$1</b>'); }
function headerOf(text){
  const t = String(text || '');
  if (!t.trimStart().startsWith('#')) return '';
  return t.trimStart().split(/\n\s*\n/)[0].trimEnd();
}
function lastHeader(pid, currentId){
  const prev = recsOf(pid).find(r => r.id !== currentId && r.status !== 'rascunho' && headerOf(r.campos.evolucao));
  return prev ? headerOf(prev.campos.evolucao) : '';
}
function putHeader(text){
  const ta = $('#r_evolucao'); const cur = ta.value;
  if (headerOf(cur)) { toast('A evolução já começa com um cabeçalho.'); ta.focus(); return; }
  ta.value = text + '\n\n' + cur.replace(/^\s+/, '');
  const firstLineEnd = ta.value.indexOf('\n');
  ta.focus(); ta.setSelectionRange(firstLineEnd, firstLineEnd);
  ta.scrollTop = 0; S.dirty = true;
}
function insertStruct(){
  const ta = $('#r_evolucao'); const cur = ta.value; const tpl = (S.db.config.estrutura || DEFAULT_STRUCT);
  if (/^S:/m.test(cur) && /^Cd:/m.test(cur)) { toast('A estrutura já está na evolução.'); ta.focus(); return; }
  const hd = headerOf(cur); let before = '', after;
  if (hd) { before = hd + '\n\n'; after = cur.trimStart().slice(hd.length).replace(/^\s+/, ''); }
  else after = cur.replace(/^\s+/, '');
  ta.value = before + tpl + (after ? '\n\n' + after : '');
  const pos = before.length + tpl.split('\n')[0].length;
  ta.focus(); ta.setSelectionRange(pos, pos); S.dirty = true;
}
function insertHeader(){ putHeader((S.db.config.cabecalho || DEFAULT_HEADER).trimEnd()); }
function copyLastHeader(pid, currentId){ const hd = lastHeader(pid, currentId || null); if (hd) putHeader(hd); }

function pickPatient(title, sub){
  return new Promise(resolve => {
    const w = document.createElement('div'); w.className = 'modal-wrap';
    w.innerHTML = `<div class="modal picker" role="dialog" aria-modal="true"><h3>${esc(title)}</h3>${sub ? `<p class="small" style="margin:0 0 12px">${sub}</p>` : ''}
      <div class="pk-search">${ico.search}<input id="pk_q" placeholder="Digite o nome ou o CPF" autocomplete="off"></div>
      <div class="pk-list" id="pk_list"></div>
      <div class="modal-actions"><button class="btn ghost" data-new style="margin-right:auto">${ico.plus}Novo paciente</button><button class="btn" data-cancel>Cancelar</button></div></div>`;
    let sel = 0, items = [];
    const lastOf = p => recsOf(p.id)[0]?.dataAtendimento || '';
    const draw = () => {
      const q = norm(w.querySelector('#pk_q').value.trim()), qd = digits(q);
      items = S.db.patients.filter(p => !p.arquivado && (!q || norm(p.nome).includes(q) || (qd.length >= 3 && p.cpf.includes(qd))))
        .sort((a, b) => lastOf(b).localeCompare(lastOf(a)) || a.nome.localeCompare(b.nome)).slice(0, 8);
      sel = Math.min(sel, Math.max(0, items.length - 1));
      w.querySelector('#pk_list').innerHTML = items.length ? items.map((p, i) => { const a = age(p.nascimento), l = lastOf(p);
        return `<button type="button" class="pk-item ${i === sel ? 'on' : ''}" data-i="${i}">${avatar(p.nome)}<span><b>${esc(dName(p.nome))}</b><small>${a !== null ? a + ' anos · ' : ''}${idDoc(p)}${l ? ' · último atendimento em ' + fmtDay(l) : ' · sem atendimentos'}</small></span></button>`; }).join('')
        : '<div class="pk-empty">Nenhum paciente encontrado. Confira a grafia ou cadastre um novo paciente.</div>';
    };
    const done = v => { w.remove(); resolve(v); };
    w.addEventListener('input', e => { if (e.target.id === 'pk_q') { sel = 0; draw(); } });
    w.addEventListener('click', e => {
      const it = e.target.closest('.pk-item'); if (it) return done(items[+it.dataset.i].id);
      if (e.target.closest('[data-cancel]')) return done(null);
      if (e.target.closest('[data-new]')) return done('__new');
    });
    w.addEventListener('keydown', e => {
      if (e.key === 'Escape') done(null);
      else if (e.key === 'ArrowDown') { e.preventDefault(); sel = Math.min(sel + 1, items.length - 1); draw(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); sel = Math.max(sel - 1, 0); draw(); }
      else if (e.key === 'Enter' && items[sel]) { e.preventDefault(); done(items[sel].id); }
    });
    w.addEventListener('mousedown', e => { if (e.target === w) done(null); });
    document.body.appendChild(w); draw(); w.querySelector('#pk_q').focus();
  });
}
function buscaGlobal(){

    L.innerHTML = h;
  };
  const done = x => { w.remove(); if (!x) return; if (x.t === 'p') go('patient', x.p.id); else go('record', x.r.id); };
  w.addEventListener('input', e => { if (e.target.id === 'gs_q') { sel = 0; draw(); } });

  w.addEventListener('keydown', e => {
    if (e.key === 'Escape') done(null);
    else if (e.key === 'ArrowDown') { e.preventDefault(); sel = Math.min(sel + 1, items.length - 1); draw(); w.querySelector('.pk-item.on')?.scrollIntoView({block:'nearest'}); }

    else if (e.key === 'Enter' && items[sel]) { e.preventDefault(); done(items[sel]); }

  document.body.appendChild(w); w.querySelector('#gs_q').focus();
}

function confirmFinalize(param, v){

function fillTokens(t){

}
function insertCustom(i){
  const b = (S.db.config.botoes || [])[i]; const ta = $('#r_evolucao'); if (!b || !ta) return;
  const txt = fillTokens(b.texto); const v = ta.value; let pos;
  if (b.onde === 'inicio') { ta.value = txt + (v.trim() ? '\n\n' + v.replace(/^\s+/, '') : ''); pos = txt.length; }
  else if (b.onde === 'fim') { ta.value = v.replace(/\s+$/, '') + (v.trim() ? '\n\n' : '') + txt; pos = ta.value.length; }
  else { const a = ta.selectionStart ?? v.length, z = ta.selectionEnd ?? a; ta.value = v.slice(0, a) + txt + v.slice(z); pos = a + txt.length; }

/* ================== Salvamento automático do rascunho ================== */
async function autoSave(force){
  if (!S.db || S.view !== 'record' || !S.dirty || !S.param) return false;
  if (!force && document.querySelector('.modal-wrap')) return false;
  const param = S.param, isNew = param.startsWith('new:');
  if (!isNew) { const r0 = getR(param); if (!r0 || r0.status !== 'rascunho') return false; }
  if (!$('#r_evolucao')) return false;
  const v = readRecForm(); if (!v.campos.evolucao && !v.campos.motivo && !v.campos.conduta) return false;
  const ta = $('#r_evolucao'), focused = document.activeElement === ta, sel = [ta.selectionStart, ta.selectionEnd, ta.scrollTop], wy = window.scrollY;
  const now = Date.now(); let r;
  if (isNew) {
    const p = getP(param.slice(4));
    r = { id:uid(), patientId:p.id, dataAtendimento:v.data, campos:v.campos, status:'rascunho', criadoEm:now, atualizadoEm:now, finalizadoEm:null, versoes:[], adendos:[] };
    S.db.records.push(r); log('Atendimento criado', `${p.nome}, ${fmtDT(r.dataAtendimento)} (salvamento automático)`); if (S.iaUndoFor === S.param) S.iaUndoFor = r.id; S.param = r.id;
  } else { r = getR(param); r.dataAtendimento = v.data; r.campos = v.campos; r.atualizadoEm = now; }
  await commit(); S.dirty = false;
  if (isNew && !force) { render(); const t = $('#r_evolucao'); if (t) { if (focused) t.focus(); t.setSelectionRange(sel[0], sel[1]); t.scrollTop = sel[2]; } window.scrollTo(0, wy); }
  const sa = $('#savedAt'); if (sa) { sa.className = 'saved-at'; sa.innerHTML = ico.check + 'Salvo automaticamente às ' + fmtTime(now); }
  return true;
}

function agLanes(list){

function agIcs(){
  const ref = S.agRef || todayISO(); const ini = S.agModo === 'dia' ? ref : semanaDe(ref), fim = S.agModo === 'dia' ? ref : addDays(ini, 6);
  const l = (S.db.agenda || []).filter(a => a.data >= ini && a.data <= fim && a.status !== 'cancelado');
  if (!l.length) { toast('Nada marcado neste período.', 'error'); return; }
  const esc_ = t => String(t).replace(/[\\;,]/g, m => '\\' + m);
  const ics = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Prontuario//Agenda//PT', ...l.flatMap(a => ['BEGIN:VEVENT', `UID:${a.id}@prontuario`, `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, '').slice(0,15)}Z`,
    `DTSTART;TZID=America/Sao_Paulo:${gDate(a.data, a.hora)}`, `DTEND;TZID=America/Sao_Paulo:${gDate(a.data, agFim(a))}`, `SUMMARY:${esc_(agTitulo(a))}`, 'END:VEVENT']), 'END:VCALENDAR'].join('\r\n');
  const b = new Blob([ics], { type:'text/calendar' }); const x = document.createElement('a'); x.href = URL.createObjectURL(b); x.download = `agenda-${ini}.ics`; document.body.appendChild(x); x.click(); x.remove();
  log('Agenda exportada (.ics)', `${fmtDate(ini)} a ${fmtDate(fim)}`); commit().catch(() => {});

}

function readRecForm(){

async function saveRecord(param, finalize){
  const v = readRecForm();
  const isNew = param.startsWith('new:');
  if (!v.campos.motivo && !v.campos.evolucao && !v.campos.conduta) { toast('Escreva a evolução antes de salvar.', 'error'); return; }
  if (finalize) {
    if (!v.campos.evolucao) { toast('Preencha a evolução antes de finalizar.', 'error'); $('#r_evolucao').focus(); return; }
    var fin = await confirmFinalize(param, v); if (!fin) return;
  }
  const now = Date.now(); let r;
  if (isNew) {
    const p = getP(param.slice(4));
    r = { id:uid(), patientId:p.id, dataAtendimento:v.data, campos:v.campos, status:'rascunho', criadoEm:now, atualizadoEm:now, finalizadoEm:null, versoes:[], adendos:[] };
    S.db.records.push(r); log('Atendimento criado', `${p.nome}, ${fmtDT(r.dataAtendimento)}`);
  } else {
    r = getR(param); const p = getP(r.patientId); const st = recStatus(r);
    if (st === 'bloqueado') { S.dirty = false; render(); toast('O prazo de 24 horas terminou e as alterações não foram salvas. Registre a correção como adendo.', 'error'); return; }
    const changed = r.dataAtendimento !== v.data || ['motivo','evolucao','conduta'].some(k => r.campos[k] !== v.campos[k]);
    if (st === 'finalizado') {
      if (!changed) { toast('Nenhuma alteração para salvar.'); return; }
      r.versoes.push({ salvoEm:r.atualizadoEm, dataAtendimento:r.dataAtendimento, campos:{...r.campos}, selo:r.selo });
      log('Atendimento finalizado alterado', `${p.nome}, ${fmtDT(r.dataAtendimento)}`);
    } else if (changed) log('Rascunho salvo', `${p.nome}, ${fmtDT(v.data)}`);
    r.dataAtendimento = v.data; r.campos = v.campos; r.atualizadoEm = now;
  }
  if (finalize) { r.status = 'finalizado'; r.finalizadoEm = Math.max(now, S.db.maxTs || 0); r.retorno = fin.retorno; S.db.config.retPadrao = fin.padrao;
    const agHoje = (S.db.agenda || []).find(a => a.pid === r.patientId && a.data === r.dataAtendimento.slice(0,10) && ['agendado','confirmado'].includes(a.status)); if (agHoje) agHoje.status = 'compareceu';
    if (fin.pag) { r.pag = fin.pag; if (fin.pag.situacao !== 'Isento') S.db.config.valorPadrao = fin.pag.valor; }
    log('Atendimento finalizado', `${getP(r.patientId).nome}, ${fmtDT(r.dataAtendimento)}${fin.retorno ? '; retorno previsto para ' + fmtDate(fin.retorno) : ''}`); }
  if (r.status === 'finalizado') await seal(r);
  await commit(); S.dirty = false; if (finalize) setTimeout(() => autoBackup('evolução finalizada'), 1500);
  toast(finalize ? `Evolução finalizada. Ajustes permitidos até ${fmtDT(r.finalizadoEm + LOCK_MS)}.` : r.status === 'rascunho' ? 'Rascunho salvo.' : 'Alterações salvas.', 'ok');
  S.view = 'record'; S.param = r.id; render(); window.scrollTo(0,0);
}
async function discardDraft(id){
  const r = getR(id); const p = getP(r.patientId);
  if (!(await confirmBox('Descartar rascunho', 'Este rascunho ainda não foi finalizado e será removido. A ação fica registrada na auditoria.', 'Descartar', true))) return;
  S.db.records = S.db.records.filter(x => x.id !== id);
  log('Rascunho descartado', `${p.nome}, ${fmtDT(r.dataAtendimento)}`);
  await commit(); S.dirty = false; toast('Rascunho descartado.', 'ok'); go('patient', p.id);
}
async function addAdendo(id){

}

async function iaCall(system, user, maxTokens){
  const ia = S.db.config.ia;
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 90000);
  let res;
  try {
    res = await fetch(IA_ENDPOINT, { method:'POST', signal:ctl.signal, headers:{
      'content-type':'application/json', 'x-api-key':ia.chave, 'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true' },
      body: JSON.stringify({ model:ia.modelo, max_tokens:maxTokens, system, messages:[{ role:'user', content:user }] }) });
  } catch(e) {
    throw new Error(e.name === 'AbortError' ? 'A resposta demorou demais. Tente de novo.' : 'Sem conexão com a internet ou com a Anthropic.');
  } finally { clearTimeout(t); }
  let j = null; try { j = await res.json(); } catch(e) {}
  if (!res.ok) {
    const m = j?.error?.message || '';
    if (res.status === 401) throw new Error('Chave de API inválida. Confira em Configurações.');
    if (res.status === 402 || /credit|billing/i.test(m)) throw new Error('Sem crédito na conta da API. Adicione crédito em console.anthropic.com.');
    if (res.status === 404) throw new Error('Modelo não encontrado. Escolha outro em Configurações.');
    if (res.status === 429) throw new Error('Limite de uso atingido. Aguarde um minuto ou revise o limite no console.');
    if (res.status === 529 || res.status >= 500) throw new Error('O serviço da Anthropic está sobrecarregado. Tente de novo em instantes.');
    throw new Error('Erro da API: ' + (m || res.status));
  }
  return { text: (j.content || []).filter(c => c.type === 'text').map(c => c.text).join('').trim(), usage: j.usage || {} };
}

}
/* Troca dados identificadores do paciente por marcadores antes do envio */
function iaSanitize(text, p){
  let t = String(text || ''), n = 0;
  const sub = (re, mark) => { t = t.replace(re, () => { n++; return mark; }); };
  const lit = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const L = '\\p{L}';
  const skip = ['da','de','do','das','dos','e'];
  if (p.nomeSocial) sub(new RegExp(`(?<![${L}])${lit(p.nomeSocial)}(?![${L}])`, 'giu'), '[paciente]');
  String(p.nomeSocial || '').split(/\s+/).filter(w => w.length >= 3 && !skip.includes(w.toLowerCase()))
    .forEach(w => sub(new RegExp(`(?<![${L}])${lit(w)}(?![${L}])`, 'giu'), '[paciente]'));
  if (p.telefone) sub(new RegExp(p.telefone.slice(-8, -4) + '[-\\s]?' + p.telefone.slice(-4), 'g'), '[telefone]');
  const nome = String(p.nome || '').trim();
  if (nome) sub(new RegExp(`(?<![${L}])${lit(nome)}(?![${L}])`, 'giu'), '[paciente]');
  String(nome).split(/\s+/).filter(w => w.length >= 3 && !skip.includes(w.toLowerCase()))
    .forEach(w => sub(new RegExp(`(?<![${L}])${lit(w)}(?![${L}])`, 'giu'), '[paciente]'));
  t = t.replace(/(\[paciente\]\s+){1,}\[paciente\]/g, '[paciente]');
  sub(/\b\d{3}\.?\d{3}\.?\d{3}-?\d{2}\b/g, '[CPF]');
  if (p.docNum && p.docNum.length >= 4) sub(new RegExp(lit(p.docNum), 'g'), '[documento]');
  if (p.nascimento) { const [y,m,d] = p.nascimento.split('-'); sub(new RegExp(`\\b${d}/${m}/(${y}|${y.slice(2)})\\b`, 'g'), '[nascimento]'); }
  sub(/[\w.+-]+@[\w-]+\.[\w.]+/g, '[e-mail]');
  sub(/(\(?\b\d{2}\)?\s?)?\b9?\d{4}[-\s]?\d{4}\b/g, '[telefone]');
  if (p.logradouro && p.logradouro.length >= 5) sub(new RegExp(lit(p.logradouro), 'gi'), '[endereço]');
  if (p.cep) sub(new RegExp(`\\b${p.cep.slice(0,5)}-?${p.cep.slice(5)}\\b`, 'g'), '[CEP]');
  return { text:t, n };
}

5. Risco: registre exatamente o que foi anotado sobre ideação suicida, plano, tentativas e heteroagressividade. Se nada foi anotado sobre risco, termine a seção I: com [verificar: risco de suicídio não registrado].
6. Use termos técnicos da psicopatologia (eutímico, hipotímico, afeto embotado, congruente, logorreia, bradipsiquismo etc.) somente quando correspondem ao que foi anotado.
7. Concordância de gênero: use o gênero indicado nas anotações ou na evolução anterior; se não houver indicação, use o masculino genérico.

10. Se algo estiver ambíguo, contraditório ou faltar informação essencial (como a dose de uma medicação iniciada), escreva [verificar: ...] no ponto exato, em vez de supor.
11. Se as anotações contiverem o registro de autorização para o uso de assistente de inteligência artificial, copie essa frase literalmente como última linha da seção Cd:.
12. Responda apenas com o texto da evolução, sem comentários, sem markdown, sem negrito e sem cercas de código.

Modelo de evolução psiquiátrica:
${ia.psiq || DEFAULT_IA_PSIQ}

Texto padrão de EEM sem alterações:
${ia.eem || DEFAULT_IA_EEM}${ia.instrucoes ? '\n\nPreferências de estilo do médico (prevalecem sobre o modelo acima):\n' + ia.instrucoes : ''}`;
}
async function iaRedigir(pid, rid){
  const ia = S.db.config.ia; const p = getP(pid); const ta = $('#r_evolucao'); const btn = $('#iaBtn');
  if (!ia?.ativo || !ia.chave) { toast('Configure o assistente em Configurações.', 'error'); return; }
  let notas = ta.value.trim(); let addConsent = false;
  if (notas.length < 15) { toast('Escreva suas anotações do atendimento antes de pedir a redação.', 'error'); ta.focus(); return; }
  if (!p.iaConsent) {
    if (!(await iaConsentir(pid, true))) return;
    addConsent = true; notas = ta.value.trim();
  }
  let prev = '';
  if (ia.anterior) { const pr = recsOf(pid).find(r => r.id !== rid && r.status !== 'rascunho' && r.campos.evolucao); if (pr) prev = pr.campos.evolucao; }
  const a = iaSanitize(notas, p), b = iaSanitize(prev, p);
  const user = `Modelo de cabeçalho:\n${S.db.config.cabecalho || DEFAULT_HEADER}\n\nModelo de estrutura:\n${S.db.config.estrutura || DEFAULT_STRUCT}\n\nIdade do paciente: ${age(p.nascimento) ?? 'não informada'}${age(p.nascimento) !== null ? ' anos' : ''}. Sexo: ${p.sexo ? p.sexo.toLowerCase() : 'não informado'}.\n\n` +
    (b.text ? `Evolução anterior (referência):\n<<<\n${b.text}\n>>>\n\n` : 'Não há evolução anterior.\n\n') +
    `Anotações do atendimento de hoje:\n<<<\n${a.text}\n>>>`;
  const label = btn ? btn.innerHTML : '';
  if (btn) { btn.disabled = true; btn.innerHTML = ico.spark + 'Redigindo…'; }
  log('Texto enviado à IA', `${p.nome}; ${ia.modelo}; ${user.length} caracteres; ${a.n + b.n} dados substituídos`); await commit();
  let out;
  busy('Redigindo a evolução com o Claude…');
  try { out = await iaCall(iaSystemPrompt(), user, 2500); }
  catch(e) { toast(e.message, 'error'); return; }
  finally { unbusy(); if (btn) { btn.disabled = false; btn.innerHTML = label; } }
  const draft = out.text.replace(/^```[a-z]*\n?|```$/g, '').replace(/\*\*(.+?)\*\*/g, '$1').trim();
  if (!draft) { toast('A IA não devolveu texto. Tente de novo.', 'error'); return; }
  const nVer = (draft.match(/\[verificar/gi) || []).length;
  const v = await modal({ title:'Rascunho da evolução', wide:true, body:`
    <p class="ia-note">Revise e ajuste o texto antes de usar. ${nVer ? `<b style="color:var(--ink)">Há ${nVer} ponto${nVer>1?'s':''} marcado${nVer>1?'s':''} com [verificar].</b>` : ''}</p>
    <textarea class="ia-draft" id="ia_out" rows="14">${esc(draft)}</textarea>
    <details class="ia-sent"><summary>Ver o que foi enviado à Anthropic (${a.n + b.n} dado${a.n + b.n === 1 ? '' : 's'} identificador${a.n + b.n === 1 ? '' : 'es'} substituído${a.n + b.n === 1 ? '' : 's'})</summary><pre>${esc(user)}</pre></details>`,
    actions:[ {label:'Descartar', value:null}, {label:'Usar este texto', cls:'primary', value: w => w.querySelector('#ia_out').value} ] });
  if (v == null) return;
  let final = v.trim();
  if ((addConsent || notas.includes(IA_CONSENT_TXT)) && !final.includes('Autorizou verbalmente')) final += '\n\n' + IA_CONSENT_TXT;
  S.iaUndo = ta.value; S.iaUndoFor = S.param; ta.value = final; S.dirty = true;
  const u = $('#iaUndo'); if (u) u.style.display = '';
  log('Rascunho da IA aplicado', p.nome);
  ta.focus(); ta.setSelectionRange(0, 0); ta.scrollTop = 0;
  toast('Texto aplicado. Revise e salve o atendimento.');
}
