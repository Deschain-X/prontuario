async function savePrefs(){
  S.db.config.idleMin = +$('#c_idle').value; S.db.config.cep = $('#c_cep').checked;
  log('Preferências alteradas', `Bloqueio em ${S.db.config.idleMin} min; busca por CEP ${S.db.config.cep ? 'ativada' : 'desativada'}`);
  await commit(); toast('Preferências salvas.');
}
async function registerIncident(){
  const v = await modal({ title:'Registrar incidente', body:`
    <div class="field"><label>Data em que ocorreu</label><input type="date" id="i_data" value="${todayISO()}" max="${todayISO()}"></div>
    <div class="field"><label>O que aconteceu</label><textarea id="i_desc" rows="3"></textarea></div>
    <div class="field"><label>Medidas tomadas</label><textarea id="i_med" rows="2" placeholder="Ex.: senha trocada, backup antigo destruído"></textarea></div>
    <div class="field"><label>Comunicado à ANPD e aos pacientes?</label><select id="i_com"><option>Não</option><option>Sim</option><option>Em avaliação</option></select></div>`,
    actions:[{label:'Cancelar', value:null},{label:'Registrar', cls:'primary', primary:true, value: w => {
      const descricao = w.querySelector('#i_desc').value.trim();
      if (!descricao) { toast('Descreva o incidente.', 'error'); return undefined; }
      return { data:w.querySelector('#i_data').value, descricao, medidas:w.querySelector('#i_med').value.trim(), comunicado:w.querySelector('#i_com').value };
    }}] });
  if (!v) return;
  S.db.incidentes.push({ id:uid(), ts:Date.now(), ...v });
  log('Incidente registrado', v.descricao.slice(0,80));
  await commit(); render(); toast('Incidente registrado.');
}
async function changePassword(){
  const p0 = $('#c_pw0').value, p1 = $('#c_pw1').value, p2 = $('#c_pw2').value;
  try { const stored = await storeGet(); await decryptJSON(stored, await deriveKey(p0, fromB64(stored.salt))); }
  catch(e) { toast('A senha atual está incorreta.', 'error'); return; }
  if (p1.length < MIN_PW) { toast(`A nova senha precisa ter pelo menos ${MIN_PW} caracteres.`, 'error'); return; }
  if (p1 !== p2) { toast('As novas senhas não coincidem.', 'error'); return; }
  const oldKey = S.key, newSalt = crypto.getRandomValues(new Uint8Array(16)), newKey = await deriveKey(p1, newSalt);
  try {
    for (const a of S.db.anexos) { const rec = await idb.get('att:' + a.id); if (rec) await idb.set('att:' + a.id, await encryptBuf(await decryptBuf(rec, oldKey), newKey)); }
  } catch(e) { toast('Não foi possível recriptografar os anexos. A senha não foi alterada.', 'error'); return; }
  S.salt = newSalt; S.key = newKey;
  log('Senha alterada'); await commit(); render(); toast('Senha alterada. Faça um novo backup.');
}
async function bkDir(){ try { const h = await idb.get('bkdir'); if (h) S.bkDirName = h.name; return h || null; } catch(e) { return null; } }
async function pickBkDir(){
  try { const h = await window.showDirectoryPicker({ id:'prontuario-backup', mode:'readwrite' }); await idb.set('bkdir', h); S.bkDirName = h.name; S.bkPerm = await bkPerm(h, true); log('Pasta de backup definida', h.name); await commit();
    if (S.bkPerm) { S.db.lastBackup = Math.min(S.db.lastBackup || 0, lastDataChange() - 1); await exportBackup(); } else render(); toast(`Backups serão salvos em ${h.name}.`, 'ok'); }
  catch(e) { if (e.name !== 'AbortError') toast('Não foi possível usar essa pasta.', 'error'); }
}
async function clearBkDir(){ await idb.del('bkdir'); S.bkDirName = null; log('Pasta de backup removida'); await commit(); render(); toast('Backups voltam para Downloads.', 'ok'); }
async function backupBlob(){
  await chainAudit();
  const p = await encryptJSON(S.db, S.key);
  const anexos = {};
  for (const a of S.db.anexos) { const rec = await idb.get('att:' + a.id); if (rec) anexos[a.id] = { iv:toB64(rec.iv), data:toB64(rec.data) }; }
  const payload = { app:APP_ID, v:DB_VERSION, exportadoEm:new Date().toISOString(), salt:toB64(S.salt), iv:p.iv, data:p.data, anexos };
  return new Blob([JSON.stringify(payload)], {type:'application/octet-stream'});
}
const BK_RE = /^prontuario-backup-(\d{4}-\d{2}-\d{2})\.pront$/;
const BK_KEEP = 30;
async function bkPerm(dir, ask){
  try { let st = await dir.queryPermission({mode:'readwrite'}); if (st !== 'granted' && ask) st = await dir.requestPermission({mode:'readwrite'}); return st === 'granted'; }
  catch(e) { return false; }
}
async function writeToDir(dir, blob, fname){
  const fh = await dir.getFileHandle(fname, {create:true}); const wr = await fh.createWritable(); await wr.write(blob); await wr.close();
  try { /* mantém só os backups dos últimos 30 dias diferentes */
    const nomes = []; for await (const [n, h] of dir.entries()) if (h.kind === 'file' && BK_RE.test(n)) nomes.push(n);
    nomes.sort().reverse().slice(BK_KEEP).forEach(n => dir.removeEntry(n).catch(() => {}));
  } catch(e) {}
}
function downloadBlob(blob, fname){ const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = fname; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }
async function exportBackup(){
  const blob = await backupBlob(); const fname = `prontuario-backup-${todayISO()}.pront`;
  let ondeSalvo = 'Downloads';
  const dir = await bkDir();
  if (dir) {
    try { if (!(await bkPerm(dir, true))) throw 0; await writeToDir(dir, blob, fname); ondeSalvo = 'a pasta ' + dir.name; S.bkPerm = true; }
    catch(e) { ondeSalvo = 'Downloads (a pasta escolhida não autorizou a gravação)'; }
  }
  if (ondeSalvo.startsWith('Downloads')) downloadBlob(blob, fname);
  S.bkWhere = ondeSalvo;
  S.db.lastBackup = Date.now(); log('Backup exportado', ondeSalvo); await commit(); render(); toast(`Backup salvo em ${S.bkWhere}.${S.bkWhere.startsWith('Downloads') ? ' Guarde uma cópia fora deste computador.' : ''}`, 'ok');
}
/* Backup automático: grava sozinho na pasta escolhida sempre que houver mudança nos dados.
   Sem pasta autorizada, baixa um backup por dia em Downloads. */
const BK_NAO_MUDA = /visualizado|Acesso ao sistema|^Sessão|^Backup|copiados|aberta|abertos|exportad|impresso|baixado|Relógio|enviada ao Google/;
function lastDataChange(){ for (let i = S.db.audit.length - 1; i >= 0; i--) if (!BK_NAO_MUDA.test(S.db.audit[i].acao)) return S.db.audit[i].ts; return 0; }
function bkPendente(){ return S.db && S.db.patients.length && lastDataChange() > (S.db.lastBackup || 0); }
let bkRunning = false;
async function autoBackup(motivo){
  if (!S.db || !S.key || S.db.config.autoBk === false || bkRunning || !bkPendente()) return false;
  bkRunning = true;
  try {
    const fname = `prontuario-backup-${todayISO()}.pront`;
    const dir = await bkDir();
    if (dir && await bkPerm(dir, false)) {
      S.bkPerm = true;
      const blob = await backupBlob(); await writeToDir(dir, blob, fname);
      S.db.lastBackup = Date.now(); log('Backup automático', `${dir.name} (${motivo})`); await persist();
      if (S.view === 'settings' || S.view === 'patients') render();
      return true;
    }
    S.bkPerm = false;
    /* sem pasta autorizada: no máximo um download por dia, ao entrar ou ao sair */
    if ((motivo === 'entrada' || motivo === 'saída') && S.db.config.bkDlDia !== todayISO()) {
      const blob = await backupBlob(); downloadBlob(blob, fname);
      S.db.config.bkDlDia = todayISO(); S.db.lastBackup = Date.now(); log('Backup automático', `Downloads (${motivo})`); await persist();
      toast('Backup automático baixado em Downloads. Escolha uma pasta em Configurações para não encher os Downloads.', 'ok');
      return true;
    }
    return false;
  } catch(e) { console.warn('backup automático', e); return false; }
  finally { bkRunning = false; }
}
async function autorizarBk(){
  const dir = await bkDir(); if (!dir) { go('settings'); return; }
  if (await bkPerm(dir, true)) { S.bkPerm = true; toast('Backup automático autorizado.', 'ok'); await autoBackup('autorização'); render(); }
  else toast('O navegador não autorizou a gravação na pasta.', 'error');
}
async function toggleAutoBk(on){ S.db.config.autoBk = on; log('Backup automático ' + (on ? 'ativado' : 'desativado')); await commit(); render(); if (on) autoBackup('ativação'); }
function pickBackup(){
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.pront,application/json';
  inp.onchange = () => inp.files[0] && importBackup(inp.files[0]); inp.click();
}
async function importBackup(file){
  let payload;
  try { payload = JSON.parse(await file.text()); if (payload.app !== APP_ID) throw 0; }
  catch(e) { toast('Este arquivo não é um backup válido do prontuário.', 'error'); return; }
  const pw = await askPassword('Restaurar backup', 'Digite a senha que estava em uso quando este backup foi gerado.');
  if (!pw) return;
  let salt, key, db;
  busy('Abrindo o backup…');
  try { salt = fromB64(payload.salt); key = await deriveKey(pw, salt); db = await decryptJSON(payload, key); }
  catch(e) { unbusy(); toast('Senha incorreta ou arquivo danificado.', 'error'); return; }
  unbusy();
  const ok = await confirmBox('Substituir os dados deste computador?',
    `O backup de ${fmtDT(payload.exportadoEm)} contém ${db.patients.length} pacientes e ${db.records.length} atendimentos. Os dados atuais deste computador serão substituídos, e a senha passa a ser a do backup.`, 'Restaurar', true);
  if (!ok) return;
  busy('Restaurando os dados…');
  await migrate(db);
  try {
    for (const k of await idb.keys()) if (String(k).startsWith('att:')) await idb.del(k);
    for (const [aid, rec] of Object.entries(payload.anexos || {})) await idb.set('att:' + aid, { iv:fromB64(rec.iv), data:fromB64(rec.data) });
  } catch(e) { toast('Os anexos do backup não puderam ser restaurados.', 'error'); }
  S.key = key; S.salt = salt; S.db = db;
  checkClock();
  log('Backup restaurado', `Arquivo gerado em ${fmtDT(payload.exportadoEm)}`);
  await commit(); unbusy(); S.dirty = false; S.lastActivity = Date.now(); S.view = 'patients'; S.param = null; render(); toast('Backup restaurado.', 'ok');
}

function notFound(){ return `<div class="panel"><div class="empty"><p>Registro não encontrado.</p><button class="btn" onclick="go('patients')">Voltar aos pacientes</button></div></div>`; }

/* ================== Relógio, inatividade e início ================== */
function tick(){
  if (!S.db) return;
  document.querySelectorAll('[data-until]').forEach(el => {
    const left = +el.dataset.until - effNow();
    if (left <= 0) { el.textContent = 'prazo encerrado'; if (S.view==='record' && !S.dirty) render(); }
    else el.textContent = fmtLeft(left);
  });
}
setInterval(tick, 30000);
['mousemove','keydown','click','scroll','touchstart'].forEach(e => document.addEventListener(e, () => { S.lastActivity = Date.now(); if ($('#idleBar')) hideIdleBar(); }, {passive:true}));
setInterval(() => {
  if (!S.key) return; const idle = Date.now() - S.lastActivity;
  if (idle > idleMs()) lockNow(true);
  else if (idle > idleMs() - 60000) showIdleBar(); else hideIdleBar();
}, 5000);
function showIdleBar(){ if ($('#idleBar')) return; const d = document.createElement('div'); d.id = 'idleBar'; d.className = 'idle-bar'; d.setAttribute('role','alert');
  d.innerHTML = `${ico.lock}<span>A sessão será bloqueada em 1 minuto por inatividade.${S.dirty ? ' O rascunho será salvo.' : ''}</span><button class="btn sm">Continuar usando</button>`;
  d.querySelector('button').onclick = () => { S.lastActivity = Date.now(); hideIdleBar(); }; document.body.appendChild(d); }
function hideIdleBar(){ $('#idleBar')?.remove(); }
setInterval(() => { if (S.key) autoSave().catch(() => {}); }, 30000);
setInterval(() => { if (S.key && !document.querySelector('.modal-wrap')) autoBackup('periódico'); }, 10 * 60000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && S.key) autoBackup('periódico'); });
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && !e.altKey && (e.key === 'k' || e.key === 'K') && S.db && !document.querySelector('.modal-wrap')) { e.preventDefault(); buscaGlobal(); }
});
document.addEventListener('keydown', e => {
  if (e.altKey && !e.ctrlKey && !e.metaKey && (e.key === 'n' || e.key === 'N') && S.db && !document.querySelector('.modal-wrap')) { e.preventDefault(); novaEvolucao(); }
});
for (const [n, m] of [['exportBackup','Gerando o backup criptografado…'],['changePassword','Recriptografando os dados…'],['openAttachment','Abrindo o arquivo…'],['printRecords','Preparando o PDF…']]) {
  const f = window[n]; window[n] = (...a) => withBusy(m, () => f(...a));
}
window.addEventListener('beforeunload', e => { if (S.dirty) { e.preventDefault(); e.returnValue = ''; } });

(async function boot(){
  if (!window.crypto || !crypto.subtle) {
    $('#app').innerHTML = `<div class="auth"><div class="auth-card"><h1>Navegador não compatível</h1><p>Abra este arquivo no Google Chrome, Microsoft Edge ou Firefox atualizados.</p></div></div>`;
    return;
  }
  const stored = await storeGet();
  stored ? renderLogin() : renderSetup();
})();
</script>
